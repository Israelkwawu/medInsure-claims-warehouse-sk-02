services:
  postgres:
    image: postgres:16
    container_name: medinsure-postgres
    restart: unless-stopped
    # Pass only the server settings. PGPORT in .env is the host port for clients.
    # If it were injected here, Postgres would listen on that port inside the container
    # while Compose still forwards to 5432.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medinsure}
      POSTGRES_USER: ${POSTGRES_USER:-medinsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medinsure_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medinsure_pgdata:/var/lib/postgresql/data
      - ./sql:/workspace/sql:ro
      - ./tests:/workspace/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medinsure_pgdata: